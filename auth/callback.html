<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8f7"><meta name="robots" content="noindex,nofollow"><title>Signing in · VISTAAR CRM</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/auth.css"></head>
<body><main class="auth-shell"><section class="auth-card glass"><a class="brand" href="/"><span class="brand-mark">V</span><span><strong>VISTAAR</strong><small>CRM</small></span></a><span class="eyebrow">SECURE ACCOUNT VERIFICATION</span><h1>Verifying <em>your account…</em></h1><p class="auth-sub" id="callback-status">Completing your VISTAAR sign-in.</p><div class="auth-error" id="callback-error"></div></section></main>
<script type="module">
import { supabase } from "/js/supabase/client.js";
const status=document.querySelector("#callback-status"),error=document.querySelector("#callback-error");
try {
  const { data, error: sessionError } = await supabase.auth.getSession();
  if (sessionError) throw sessionError;
  if (!data.session) throw new Error("No active session was returned. Use the verification code from your email or sign in again.");
  status.textContent="Account verified. Opening your workspace…";
  window.location.replace("/");
} catch (e) {
  status.textContent="We couldn't complete verification.";
  error.textContent=e.message||"Please return to VISTAAR CRM and try again.";
  const retry=document.createElement("a");retry.href="/";retry.textContent="Back to VISTAAR CRM";retry.className="btn btn-primary";retry.style.display="inline-flex";retry.style.marginTop="16px";document.querySelector(".auth-card").append(retry);
}
</script></body></html>
